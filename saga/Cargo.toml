[workspace]
resolver = "2"
# Same rationale as the event-driven workspace: one `cargo build` locally, but
# each service is conceptually its own repo/pipeline/container. Two new
# members versus event-driven: inventory-service and payments-service, the two
# saga participants orders-service now orchestrates.
members = [
    "services/users-service",
    "services/catalog-service",
    "services/inventory-service",
    "services/payments-service",
    "services/orders-service",
    "services/notifications-service",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Common versions. As in the earlier labs we deliberately do NOT share a
# `shared` crate — each service duplicates the tiny bits it needs (AppError,
# event/command shapes). That duplication is a feature: it keeps services
# independently deployable.
[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same broker as event-driven: plain NATS core (no JetStream). Saga commands
# and replies are still just pub/sub messages, not a durable log — see the
# README's "known gap" on saga timeouts/restarts for what that costs here.
async-nats = ">=0.33, <1.0"
futures = "0.3"
