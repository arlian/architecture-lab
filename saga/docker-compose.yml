# Runs NATS plus all six services as containers on one network.
#
#   * Each Rust service builds from the SAME context (the workspace root, `.`)
#     but a different Dockerfile — one image per deployable.
#   * As in event-driven, no service's config names another service's URL —
#     every one of them only ever talks to `nats`. inventory and payments are
#     saga *participants*: they take directed commands from orders (via NATS
#     subjects), they are never called directly.
#   * notifications has no published port: it has no HTTP surface, only a NATS
#     subscription. Watch `docker compose logs -f notifications` to see it work.

services:
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

  users:
    build:
      context: .
      dockerfile: services/users-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  catalog:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  orders:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NATS_URL: nats://nats:4222
    # `depends_on` only orders container *startup*, not NATS/participant
    # readiness. orders-service subscribes to reply subjects at boot, so a
    # slow NATS could make it panic before it's ready to accept traffic.
    depends_on:
      - nats

  inventory:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  payments:
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  notifications:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
