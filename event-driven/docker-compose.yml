# Runs NATS plus all four services as containers on one network.
#
#   * Each Rust service builds from the SAME context (the workspace root, `.`)
#     but a different Dockerfile — one image per deployable, same as the
#     microservices lab.
#   * Unlike microservices, the services do not address each other at all —
#     every one of them only ever talks to `nats`. That's the structural
#     signature of choreography: no service's config names another service.
#   * notifications has no published port: it has no HTTP surface, only a NATS
#     subscription. Watch `docker compose logs -f notifications` to see it work.

services:
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

  users:
    build:
      context: .
      dockerfile: services/users-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  catalog:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats

  orders:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NATS_URL: nats://nats:4222
    # `depends_on` only orders container *startup*, not NATS readiness. Orders
    # subscribes at boot (unlike the old HTTP clients, which called lazily), so
    # a slow NATS could make Orders panic before it's ready to accept traffic.
    # Adding a real healthcheck + `condition: service_healthy` is a good
    # exercise (same one the microservices README suggests).
    depends_on:
      - nats

  notifications:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
