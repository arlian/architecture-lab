[workspace]
resolver = "2"
# One deployable made of library crates: `app` is the only binary, and it is the
# composition root that wires `users`, `catalog` and `orders` together. `shared`
# is the small kernel every module may depend on — see its crate docs.
members = [
    "modules/shared",
    "modules/users",
    "modules/catalog",
    "modules/orders",
    "modules/app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Dependencies shared across the workspace. Individual crates opt in with
# `dep = { workspace = true }`, so every module uses the exact same version.
[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal module crates. Cargo enforces the boundaries: a module can only
# `use` another one if it lists it in its own Cargo.toml.
shared = { path = "modules/shared" }
users = { path = "modules/users" }
catalog = { path = "modules/catalog" }
orders = { path = "modules/orders" }
