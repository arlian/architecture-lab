[package]
name = "orders-app"
edition.workspace = true
version.workspace = true
license.workspace = true

# The two composition roots. Same library, same use cases, two programs — one
# that listens on a socket and one that reads argv. Neither contains a line of
# order logic; both are ~40 lines of "here are your adapters, off you go".
[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

# Every infrastructure dependency in this lab lives in this file. That is not
# an accident of packaging — it is the architecture, spelled out by Cargo.
# `orders-core` cannot use any of these, because it doesn't depend on them and
# the arrow only points this way.
[dependencies]
orders-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
